name: Publicar portafolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Construir sitio
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/build.py
      - name: Validar enlaces y contenido
        run: python3 scripts/check_site.py
      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
